<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Cake 🎂</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container">
      <div id="birthdayText">
        <div id="mainTitle">Happy Birthday, Gargi!</div>
        <div id="subTitle">Make a wish and blow candles.</div>
      </div>

      <div class="cake-stage">
        <div class="cake" id="cake" aria-label="Birthday cake"></div>
      </div>

      <button id="startCelebration" type="button">🎉 Start Celebration 🎂</button>
      <button id="manualBlow" class="manual-blow" type="button">💨 Blow out candles</button>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const name = params.get("name") || "Gargi";
      let candleCount = parseInt(params.get("candles"), 10) || 4;
      candleCount = Math.min(Math.max(candleCount, 1), 30);

      const mainTitle = document.getElementById("mainTitle");
      const subTitle = document.getElementById("subTitle");
      const cake = document.getElementById("cake");
      const startButton = document.getElementById("startCelebration");
      const manualBlowButton = document.getElementById("manualBlow");

      mainTitle.textContent = `Happy Birthday, ${name}!`;
      subTitle.textContent = "Make a wish and blow candles.";

      const colors = [
        "green-candle",
        "purple-candle",
        "blue-candle",
        "yellow-candle",
      ];

      function createCandles(count) {
        cake.innerHTML = "";

        const candlesPerRow = 6;
        const baseLeft = 45;
        const baseBottom = 18;
        const colSpacing = 30;
        const rowSpacing = 24;

        for (let i = 0; i < count; i++) {
          const candle = document.createElement("div");
          candle.classList.add("candle");

          const colorClass = colors[Math.floor(Math.random() * colors.length)];
          candle.classList.add(colorClass);

          const row = Math.floor(i / candlesPerRow);
          const col = i % candlesPerRow;
          const rowShift = row % 2 === 0 ? 0 : 10;

          candle.style.left = `${baseLeft + col * colSpacing + rowShift}px`;
          candle.style.bottom = `${baseBottom + row * rowSpacing}px`;

          cake.appendChild(candle);
        }
      }

      createCandles(candleCount);

      let candlesBlownOut = false;
      let analyser = null;
      let stream = null;
      let animationFrameId = null;

      function blowOutCandles() {
        if (candlesBlownOut) return;

        candlesBlownOut = true;
        manualBlowButton.disabled = true;

        const candles = document.querySelectorAll(".candle");
        candles.forEach((candle, index) => {
          setTimeout(() => {
            candle.classList.add("blown");
          }, index * 60 + Math.random() * 120);
        });

        setTimeout(() => {
          subTitle.textContent = `HAPPY BIRTHDAY ${name.toUpperCase()}! 🎉`;
        }, 800);
      }

      async function startMicDetection() {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            subTitle.textContent = "Microphone unavailable. Use the button to blow out the candles.";
            return;
          }

          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false,
            },
          });

          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioContext.createAnalyser();
          const source = audioContext.createMediaStreamSource(stream);
          source.connect(analyser);
          analyser.fftSize = 2048;

          const samples = new Float32Array(analyser.fftSize);
          let loudFrames = 0;
          let lastBlow = 0;

          subTitle.textContent = "Microphone ready! Blow toward your microphone 💨";

          function detectBlow() {
            if (!analyser) return;

            analyser.getFloatTimeDomainData(samples);

            let sum = 0;
            for (let i = 0; i < samples.length; i++) {
              sum += samples[i] * samples[i];
            }

            const rms = Math.sqrt(sum / samples.length);

            if (rms > 0.055) {
              loudFrames += 1;
            } else {
              loudFrames = 0;
            }

            if (
              loudFrames >= 4 &&
              !candlesBlownOut &&
              Date.now() - lastBlow > 1500
            ) {
              lastBlow = Date.now();
              blowOutCandles();
              return;
            }

            animationFrameId = requestAnimationFrame(detectBlow);
          }

          detectBlow();
        } catch (error) {
          console.error("Microphone error:", error);
          subTitle.textContent = "Microphone unavailable. Use the button to blow out the candles.";
          startButton.disabled = false;
        }
      }

      startButton.addEventListener("click", async () => {
        startButton.textContent = "🎂 Make a wish!";
        startButton.disabled = true;
        await startMicDetection();
      });

      manualBlowButton.addEventListener("click", () => {
        blowOutCandles();
      });
    </script>
  </body>
</html>
