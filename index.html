    <script>
      // Read URL params
      const params = new URLSearchParams(window.location.search);
      const name = params.get("name") || "Gargi";
      let candleCount = parseInt(params.get("candles")) || 4;
      candleCount = Math.min(Math.max(candleCount, 1), 30);

      const birthdayText = document.getElementById("birthdayText");
      birthdayText.innerHTML = `
        <div id="mainTitle">Happy Birthday, ${name}!</div>
        <div id="subTitle">Make a wish and blow candles.</div>
      `;

      const cake = document.getElementById("cake");

      const colors = [
        "green-candle",
        "purple-candle",
        "blue-candle",
        "yellow-candle",
      ];
      const CAKE_VISUAL_WIDTH = 35;

      function createCandles(count) {
        cake.innerHTML = "";
        const CANDLE_VISUAL_WIDTH = 2;
        const availableWidth = CAKE_VISUAL_WIDTH;
        const candlesPerRow = 6;
        const rowCount = Math.ceil(count / candlesPerRow);
        const shiftAmount = 4;

        for (let i = 0; i < count; i++) {
          const candle = document.createElement("div");
          candle.classList.add("candle");
          const colorClass = colors[Math.floor(Math.random() * colors.length)];
          candle.classList.add(colorClass);

          const row = Math.floor(i / candlesPerRow);
          const col = i % candlesPerRow;
          const totalCandlesInRow = Math.min(
            candlesPerRow,
            count - row * candlesPerRow
          );
          const rowSpacing = availableWidth / (totalCandlesInRow + 1);

          const leftBase = rowSpacing * (col + 1) - CANDLE_VISUAL_WIDTH / 2 + 5;
          const rowShift = row % 2 === 0 ? 0 : shiftAmount;

          candle.style.position = "absolute";
          candle.style.top = `${10 + row * 3}px`;
          candle.style.left = `${leftBase - rowShift + 4}px`;

          cake.appendChild(candle);
        }
      }

      createCandles(candleCount);

// === Microphone / Blow Detection ===

let candlesBlownOut = false;

async function startMicDetection() {
  const subTitle = document.getElementById("subTitle");

  try {
    if (!navigator.mediaDevices?.getUserMedia) {
      subTitle.textContent =
        "Microphone unavailable. Open this page using HTTPS.";
      return;
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    const audioContext = new (
      window.AudioContext || window.webkitAudioContext
    )();

    await audioContext.resume();

    const source = audioContext.createMediaStreamSource(stream);
    const analyser = audioContext.createAnalyser();

    analyser.fftSize = 2048;
    source.connect(analyser);

    const samples = new Float32Array(analyser.fftSize);

    subTitle.textContent = "Microphone ready! Blow toward your microphone 💨";

    let loudFrames = 0;
    let lastBlow = 0;

    function detectBlow() {
      analyser.getFloatTimeDomainData(samples);

      let sum = 0;

      for (let i = 0; i < samples.length; i++) {
        sum += samples[i] * samples[i];
      }

      const rms = Math.sqrt(sum / samples.length);

      // Require several consecutive loud frames to reduce false triggers.
      if (rms > 0.055) {
        loudFrames++;
      } else {
        loudFrames = 0;
      }

      if (
        loudFrames >= 4 &&
        !candlesBlownOut &&
        Date.now() - lastBlow > 1500
      ) {
        lastBlow = Date.now();
        blowOutCandles();
      }

      requestAnimationFrame(detectBlow);
    }

    detectBlow();
  } catch (err) {
    console.error("Microphone error:", err);

    subTitle.textContent =
      "Microphone unavailable. Use the button to blow out the candles.";
  }
}

function blowOutCandles() {
  if (candlesBlownOut) return;

  candlesBlownOut = true;

  const candles = document.querySelectorAll(".candle");

  candles.forEach((candle) => {
    setTimeout(() => {
      candle.classList.add("blown");
    }, Math.random() * 700);
  });

  setTimeout(() => {
    const subTitle = document.getElementById("subTitle");

    if (subTitle) {
      subTitle.textContent =
        "HAPPY BIRTHDAY GARRGIYAAAAAAAAAAAAAAA!! 🎉";
    }
  }, 1000);
}
